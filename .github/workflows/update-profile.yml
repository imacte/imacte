name: Update profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: read

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'imacte/imacte'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check generator
        run: node --test scripts/generate-profile.test.mjs
      - name: Refresh statistics and render cards
        run: node scripts/generate-profile.mjs --refresh
      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ data/stats.json
          if git diff --cached --quiet; then
            echo 'No statistics changed.'
            exit 0
          fi
          git commit -m 'Update profile statistics'
          git push
